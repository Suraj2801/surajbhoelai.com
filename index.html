<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suraj Bhoelai - Official Website</title>
  <meta name="description" content="Official website of guitarist Suraj Bhoelai. Watch guitar performances and get PDF tablatures on Payhip." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cinzel', 'serif'],
          },
        },
      },
    };
  </script>

  <style>
    body {
      background-color: #0b0b0e;
      color: #f3f4f6;
      font-family: 'Cinzel', serif;
    }
  </style>
</head>
<body class="min-h-[100dvh] flex flex-col justify-between antialiased relative overflow-x-hidden">

  <!-- ACHTERGROND VIDEO -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <video autoplay muted loop playsinline class="w-full h-full object-cover">
      <source src="background.mp4" type="video/mp4" />
    </video>
    <!-- Subtiele overlay zodat de tekst goed leesbaar blijft maar de video mooi zichtbaar is -->
    <div class="absolute inset-0 bg-black/50 sm:bg-black/40"></div>
  </div>

  <!-- Header / Nav (Op mobiel gecentreerd onder elkaar, op desktop naast elkaar) -->
  <header class="w-full pt-5 pb-3 sm:py-6 px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4 sm:gap-0 max-w-4xl mx-auto relative z-10">
    <div>
      <a href="#" class="flex items-center justify-center">
        <img src="logo.png" alt="Suraj Bhoelai Logo" class="h-20 sm:h-28 md:h-36 w-auto object-contain" />
      </a>
    </div>
    <nav class="flex items-center justify-center gap-6 text-xs sm:text-sm text-gray-300 sm:text-gray-400">
      <a href="https://www.youtube.com/@surajbhoelai" target="_blank" rel="noopener noreferrer" class="py-1 px-2 hover:text-white transition-colors">YouTube</a>
      <a href="https://payhip.com/surajbhoelai" target="_blank" rel="noopener noreferrer" class="py-1 px-2 hover:text-white transition-colors">Payhip Tabs</a>
    </nav>
  </header>

  <!-- Main Content: Single Video & Payhip Link -->
  <main class="w-full max-w-3xl mx-auto px-4 py-4 sm:py-8 flex flex-col items-center text-center relative z-10">
    
    <!-- Titel / Intro -->
    <h1 class="text-lg sm:text-xl md:text-2xl font-semibold mb-4 sm:mb-6 tracking-wide leading-snug">
      Suraj Bhoelai Official Website
    </h1>

    <!-- Uitgelichte YouTube Video -->
    <div class="w-full aspect-video rounded-xl overflow-hidden shadow-2xl bg-black border border-gray-800/80 mb-6 sm:mb-8">
      <iframe
        class="w-full h-full"
        src="https://www.youtube.com/embed/bd-XvaTI468?rel=0"
        title="Suraj Bhoelai Guitar Video"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <!-- Contact / Info regel -->
    <p class="text-xs sm:text-sm text-gray-300 mb-6 sm:mb-8 leading-relaxed">
      Contact &amp; Tab requests:<br class="sm:hidden" />
      <a href="mailto:info@surajbhoelai.com" class="text-white underline hover:text-gray-200 break-all">info@surajbhoelai.com</a>
    </p>

    <!-- Grote Payhip Tabs Knop -->
    <a href="https://payhip.com/surajbhoelai" target="_blank" rel="noopener noreferrer"
       class="w-full sm:w-auto sm:min-w-[280px] bg-[#ff0000] hover:bg-[#cc0000] active:scale-[0.99] text-white font-semibold py-4 px-6 sm:px-8 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-3 text-sm sm:text-base">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
      </svg>
      <span>CLICK HERE FOR TABS...</span>
    </a>

  </main>

  <!-- Footer -->
  <footer class="w-full py-5 sm:py-6 px-4 text-center text-[11px] sm:text-xs text-gray-400 relative z-10">
    <p>&copy; <span id="year"></span> Suraj Bhoelai. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
